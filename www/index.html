
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NYR Domain Checker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #f3f3f3;
      font-family: Arial, sans-serif;
      color: #111;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      border: 3px solid black;
      box-shadow: 8px 8px 0 black;
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
      font-weight: 900;
    }

    p {
      font-size: 14px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      background: #b8ff65;
      border: 3px solid black;
      box-shadow: 4px 4px 0 black;
      font-weight: 900;
      font-size: 15px;
      cursor: pointer;
    }

    button:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 black;
    }

    #result {
      display: none;
      margin-top: 22px;
      padding: 15px;
      border: 2px solid black;
      background: #fff9c4;
      overflow-wrap: anywhere;
    }

    #domain {
      font-size: 14px;
      font-weight: bold;
      margin: 10px 0;
    }

    #url {
      padding: 10px;
      background: white;
      border: 1px solid black;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .copy-btn {
      background: #80d9ff;
      margin-top: 10px;
    }

    .footer {
      margin-top: 20px;
      font-size: 11px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>DOMAIN CHECKER</h1>
    <p>Tool untuk mengetahui domain dan URL halaman yang sedang dibuka.</p>

    <button onclick="checkDomain()">CEK DOMAIN</button>

    <div id="result">
      <strong>Halaman <span id="domain"></span> menyatakan:</strong>

      <p id="url"></p>

      <button class="copy-btn" onclick="copyURL()">
        SALIN URL
      </button>
    </div>

    <div class="footer">
      NYR DOMAIN TESTER
    </div>
  </div>

  <script>
    function checkDomain() {
      const currentURL = window.location.href;
      const currentDomain = window.location.hostname;

      document.getElementById("domain").textContent = currentDomain;
      document.getElementById("url").textContent = currentURL;
      document.getElementById("result").style.display = "block";
    }

    function copyURL() {
      const currentURL = window.location.href;

      navigator.clipboard.writeText(currentURL)
        .then(() => {
          alert("URL berhasil disalin!");
        })
        .catch(() => {
          alert("Gagal menyalin URL.");
        });
    }
  </script>

</body>
</html>
